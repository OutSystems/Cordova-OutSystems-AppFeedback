repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs', 'src/main/libs'
    }
}

dependencies {
    // MobileECT.aar is added through flatDir, which carries no POM, so its dependencies are declared
    // here. AndroidX AppCompat (and androidx.core) comes from CordovaLib.
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation(name: 'MobileECT', ext: 'aar')
}